[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honeynet-soc"
version = "1.0.1"
description = "Multi-Vector Low-Interaction Honeypot & SOC Telemetry Engine with Wazuh CDB Integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aleksei Zharkou" }
]
keywords = [
    "cybersecurity",
    "honeypot",
    "soc",
    "wazuh",
    "threat-intelligence",
    "mitre-attack",
    "blue-team",
    "dfir"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
ssh = ["paramiko>=3.0.0"]
test = ["pytest>=7.0.0"]

[project.scripts]
honeynet = "honeynet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["honeynet"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
